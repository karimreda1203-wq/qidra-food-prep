<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>قِدرة المطبخ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: kitchen pass — a conditions rail beside a prep ticket; data, logging and settings as tabs */
:root{
  --bg:#eef1ec; --surface:#fbfcfa; --sunk:#e3e8e1; --line:#cfd7cc;
  --ink:#18221b; --muted:#5b6a5f; --accent:#2c6a43; --accent-ink:#ffffff; --accent-soft:#d8eadc;
  --spice:#b9770e; --spice-soft:#f6e6c6; --bad:#b23a2e; --bad-soft:#f6dcd8;
  --ticket:#fffef8; --ticket-line:#d9d4bf;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201b; --sunk:#0d120f; --line:#2b362f;
  --ink:#e4ebe5; --muted:#93a297; --accent:#6dbb87; --accent-ink:#0b1a10; --accent-soft:#1f3527;
  --spice:#efb447; --spice-soft:#3a2e15; --bad:#ef8a7c; --bad-soft:#3b1f1b;
  --ticket:#1c231e; --ticket-line:#38423a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201b; --sunk:#0d120f; --line:#2b362f;
  --ink:#e4ebe5; --muted:#93a297; --accent:#6dbb87; --accent-ink:#0b1a10; --accent-soft:#1f3527;
  --spice:#efb447; --spice-soft:#3a2e15; --bad:#ef8a7c; --bad-soft:#3b1f1b;
  --ticket:#1c231e; --ticket-line:#38423a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
#app{max-width:1120px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--accent);line-height:1}
.brand span{color:var(--muted);font-size:13px}
.rest{display:flex;gap:8px;align-items:center;margin-inline-start:auto;flex-wrap:wrap}
select,input[type=text],input[type=number],input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
input[type=number]{width:84px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;min-height:38px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--spice-soft);border:1px solid color-mix(in srgb,var(--spice) 35%,transparent);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.banner p{margin:0;flex:1 1 280px}

/* today */
.today{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.today{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:16px}
.field{display:grid;gap:6px}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;background:var(--sunk);border:1px solid var(--line)}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--ink)}
.chip.hot{background:var(--spice-soft);border-color:color-mix(in srgb,var(--spice) 45%,transparent)}
label.chip{cursor:pointer}
label.chip input{margin:0;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 4px;cursor:pointer;font-size:13px;font-weight:600}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

.ticket{background:var(--ticket);border:1px solid var(--ticket-line);border-radius:4px;box-shadow:0 1px 0 var(--ticket-line),0 10px 24px -18px rgba(0,0,0,.35);position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 6px 8px,var(--bg) 5px,transparent 5.5px) 0 0/12px 8px repeat-x}
.ticket::before{top:-1px;transform:scaleY(-1)}
.ticket::after{bottom:-1px}
.t-head{padding:22px 20px 12px;border-bottom:2px dashed var(--ticket-line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:end}
.t-head h2{font-family:var(--f-display);font-size:22px;font-weight:500}
.t-meta{font-family:var(--f-num);font-size:13px;color:var(--muted);direction:ltr;text-align:left}
.t-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.t-table th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:10px 12px;border-bottom:1px solid var(--ticket-line);white-space:nowrap}
.t-table td{padding:8px 12px;border-bottom:1px dotted var(--ticket-line);vertical-align:middle}
.t-table td.n,.t-table th.n{text-align:center}
.t-table tr:last-child td{border-bottom:0}
.dish{font-weight:600}
.range{display:block;font-size:11.5px;color:var(--muted);font-family:var(--f-num)}
.prep{font-family:var(--f-num);font-weight:600;font-size:20px;color:var(--accent)}
.lo{width:64px;text-align:center;padding:4px 6px;min-height:32px}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--spice-soft);color:var(--ink);margin-inline-start:6px;white-space:nowrap}
.t-foot{border-top:2px dashed var(--ticket-line);padding:14px 20px 22px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.tot{display:flex;gap:22px;flex-wrap:wrap}
.tot div{display:grid}
.tot b{font-family:var(--f-num);font-size:22px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.week{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.week-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px;align-items:end}
.wd{display:grid;gap:4px;justify-items:center;cursor:pointer;border:1px solid transparent;border-radius:8px;padding:6px 2px;background:none}
.wd:hover{border-color:var(--line)}
.wd[aria-current=true]{border-color:var(--accent);background:var(--accent-soft)}
.bar{width:70%;max-width:44px;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85}
.bar.hot{background:var(--spice)}
.wd .num{font-size:12.5px}
.wd small{font-size:11px;color:var(--muted);white-space:nowrap}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{font-size:17px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-num);font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.tbl td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.meter{display:inline-block;width:60px;height:6px;background:var(--sunk);border-radius:3px;vertical-align:middle;margin-inline-start:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;background:var(--sunk);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.fmt{font-size:12.5px;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:100%}
.fmt th{background:var(--sunk);font-weight:600}
.fmt th,.fmt td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:start}
.fmt td.opt,.fmt th.opt{color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:12px 0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.report{background:var(--sunk);border-radius:8px;padding:10px 14px;font-size:13.5px}
.report ul{margin:4px 0 0;padding-inline-start:18px}
.warn{color:var(--bad)}
.radio{display:flex;gap:14px;flex-wrap:wrap}
.radio label{display:flex;gap:6px;align-items:center;cursor:pointer}
.radio input{accent-color:var(--accent)}
ol.steps{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.log-table td{padding:6px 8px;border-bottom:1px solid var(--line)}
.log-table input[type=number]{width:80px}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.dot.warn{background:var(--spice)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);padding:8px 12px;border-radius:8px}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.btn,.wd,.chip{transition:border-color .15s,background .15s}}
</style>

    <div class="brand"><h1>قِدرة</h1><span>كمية التحضير اليومية لكل أكلة</span></div>

  <div id="banner"></div>

</div>

<script>
"use strict";
document.documentElement.setAttribute('dir','rtl');

/* ============ helpers ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=86400000;
const isoNum=iso=>Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))/DAY;
const numIso=n=>new Date(n*DAY).toISOString().slice(0,10);
const addDays=(iso,k)=>numIso(isoNum(iso)+k);
const dowOf=iso=>new Date(isoNum(iso)*DAY).getUTCDay(); // 0 = الأحد
const todayIso=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const seasonOf=iso=>{const m=+iso.slice(5,7);return m===12||m<=2?'شتاء':m<=5?'ربيع':m<=8?'صيف':'خريف'};
const fmt=(n,d=0)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const AR_DIG={'٠':0,'١':1,'٢':2,'٣':3,'٤':4,'٥':5,'٦':6,'٧':7,'٨':8,'٩':9,'۰':0,'۱':1,'۲':2,'۳':3,'۴':4,'۵':5,'۶':6,'۷':7,'۸':8,'۹':9};
const westDigits=s=>String(s).replace(/[٠-٩۰-۹]/g,c=>AR_DIG[c]).replace(/٫/g,'.').replace(/٬/g,',');
const norm=s=>westDigits(String(s??'')).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[_\-()]/g,' ').replace(/\s+/g,' ').trim();
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}

/* ============ Egyptian calendar ============ */
// [أول رمضان, أول عيد الفطر, أول عيد الأضحى, رأس السنة الهجرية, المولد النبوي] — مصر، تقريبي ±يوم
const ISL={2019:['05-06','06-04','08-11','08-31','11-09'],2020:['04-24','05-24','07-31','08-20','10-29'],2021:['04-13','05-13','07-20','08-10','10-19'],2022:['04-02','05-02','07-09','07-30','10-08'],2023:['03-23','04-21','06-28','07-19','09-27'],2024:['03-11','04-10','06-16','07-07','09-15'],2025:['03-01','03-30','06-06','06-26','09-04'],2026:['02-19','03-20','05-27','06-16','08-26'],2027:['02-08','03-10','05-16','06-06','08-15'],2028:['01-28','02-27','05-05','05-25','08-03'],2029:['01-16','02-14','04-24','05-14','07-24'],2030:['01-06','02-05','04-13','05-03','07-13']};
const FIXED={'01-01':'newyear','01-07':'jan7','01-25':'jan25','02-14':'valentine','03-21':'mother','04-25':'apr25','05-01':'may1','06-30':'jun30','07-23':'jul23','10-06':'oct6'};
const OFFICIAL=['jan7','jan25','apr25','may1','jun30','jul23','oct6','hny','mawlid'];
const CAL_EVENTS=[
  {key:'ramadan',name:'رمضان',match:['ramadan']},
  {key:'fitr',name:'عيد الفطر',match:['fitr']},
  {key:'adha',name:'عيد الأضحى',match:['adha']},
  {key:'sham',name:'شم النسيم',match:['sham']},
  {key:'valentine',name:'عيد الحب',match:['valentine']},
  {key:'mother',name:'عيد الأم',match:['mother']},
  {key:'newyear',name:'رأس السنة',match:['newyear']},
  {key:'official',name:'إجازة رسمية',match:OFFICIAL},
  {key:'school',name:'أيام الدراسة',match:['school']},
];
function orthodoxEaster(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),dd=((d+e+114)%31)+1;return addDays(`${y}-${pad(m)}-${pad(dd)}`,13)}
const calCache=new Map();
function calSet(iso){
  let s=calCache.get(iso); if(s) return s; s=new Set();
  const y=+iso.slice(0,4), md=iso.slice(5), n=isoNum(iso);
  if(FIXED[md]) s.add(FIXED[md]);
  if(addDays(orthodoxEaster(y),1)===iso) s.add('sham');
  const r=ISL[y];
  if(r){const [ram,fitr,adha,hny,maw]=r.map(x=>isoNum(`${y}-${x}`));
    if(n>=ram&&n<fitr) s.add('ramadan');
    if(n>=fitr&&n<fitr+3) s.add('fitr');
    if(n>=adha&&n<adha+4) s.add('adha');
    if(n===hny) s.add('hny'); if(n===maw) s.add('mawlid');}
  calCache.set(iso,s); return s;
}
function inSchool(iso,sc){const md=iso.slice(5);const inYear=md>=sc.start||md<sc.end;const brk=md>=sc.bStart&&md<sc.bEnd;return inYear&&!brk}
function calMatchFor(name){
  const n=norm(name);
  if(n.includes('رمضان')||n.includes('ramadan')) return ['ramadan'];
  if(n.includes('فطر')) return ['fitr'];
  if(n.includes('اضحي')||n.includes('الكبير')) return ['adha'];
  if(n.includes('شم ')||n.endsWith('شم')||n.includes('النسيم')) return ['sham'];
  if(n.includes('الحب')||n.includes('فالنتين')||n.includes('valentine')) return ['valentine'];
  if(n.includes('عيد الام')||n.includes('mother')) return ['mother'];
  if(n.includes('راس السنه')||n.includes('new year')) return ['newyear'];
  if(n.includes('يوليو')) return ['jul23'];
  if(n.includes('اكتوبر')) return ['oct6'];
  if(n.includes('يناير')||n.includes('الشرطه')) return ['jan25'];
  if(n.includes('سيناء')) return ['apr25'];
  if(n.includes('عمال')) return ['may1'];
  if(n.includes('يونيو')) return ['jun30'];
  if(n.includes('مولد')||n.includes('نبوي')) return ['mawlid'];
  if(n.includes('ميلاد')||n.includes('كريسماس')) return ['jan7'];
  if(n.includes('هجري')) return ['hny'];
  if(n.includes('دراس')||n.includes('مدارس')||n.includes('school')) return ['school'];
  if(n.includes('رسمي')||n.includes('اجازه')||n.includes('holiday')) return OFFICIAL;
  return null;
}
function buildEvents(fileNames){
  const evs=fileNames.map((name,i)=>({key:'f'+i,name,match:calMatchFor(name),file:true}));
  const covered=new Set(evs.flatMap(e=>e.match||[]));
  for(const ce of CAL_EVENTS){const rem=ce.match.filter(k=>!covered.has(k));if(rem.length) evs.push({key:ce.key,name:ce.name,match:rem,file:false});}
  return evs;
}
function eventOn(R,ev,iso){return !!ev.match&&ev.match.some(k=>k==='school'?inSchool(iso,R.school):calSet(iso).has(k))}
function activeEvents(R,iso,day){
  const s=new Set();
  if(day&&day.full){(day.e||[]).forEach(k=>s.add(k));return s}
  for(const ev of R.events){
    if(ev.file&&day){ if((day.e||[]).includes(ev.key)) s.add(ev.key); }
    else if(eventOn(R,ev,iso)) s.add(ev.key);
  }
  return s;
}

const Store={mode:'mem',db:null,uid:null,
  async init(){
    try{ if(window.claude&&typeof window.claude.use==='function'){
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(db&&user){const id=await user.id(); if(id){this.db=db;this.uid=id;this.mode='db';return}}
    }}catch(e){}
    try{localStorage.setItem('qidra:t','1');localStorage.removeItem('qidra:t');this.mode='local'}catch(e){this.mode='mem'}
  },
  col(){return this.db.collection('data/users/'+this.uid)},
  async list(){
    if(this.mode==='db'){const q=await this.col().where('type','==','restaurant').get();return q.docs.map(d=>({id:d.data().rid,name:d.data().name,updated:d.data().updated||0}))}
    if(this.mode==='local'){try{return JSON.parse(localStorage.getItem('qidra:list')||'[]')}catch(e){return[]}}
    return [];
  },
  async load(id){
    if(this.mode==='db'){
      const ref=this.col().doc('r_'+id); const m=await ref.get(); if(!m.exists) return null;
      const meta=JSON.parse(JSON.stringify(m.data().meta)); meta.days={};
      const ch=await ref.collection('chunks').get();
      ch.docs.forEach(d=>Object.assign(meta.days,d.data().days||{}));
      return meta;
    }
    if(this.mode==='local'){try{return JSON.parse(localStorage.getItem('qidra:r:'+id))}catch(e){return null}}
    return null;
  },
  chunkKey(iso){return iso.slice(0,4)+'q'+(Math.floor((+iso.slice(5,7)-1)/3)+1)},
  async save(R,dirtyIsos){ // dirtyIsos: null = all
    if(this.mode==='mem') return;
    R.updated=Date.now();
    if(this.mode==='local'){
      localStorage.setItem('qidra:r:'+R.id,JSON.stringify(R));
      const l=(await this.list()).filter(x=>x.id!==R.id);l.push({id:R.id,name:R.name,updated:R.updated});
      localStorage.setItem('qidra:list',JSON.stringify(l));return;
    }
    const {days,...meta}=R; const ref=this.col().doc('r_'+R.id);
    const keys=new Set((dirtyIsos||Object.keys(days)).map(i=>this.chunkKey(i)));

const SYN={

  dish:['الاكله','اكله','الاكلات','الصنف','صنف','الاصناف','الطبق','طبق','المنتج','منتج','الوجبه','وجبه','item','dish','product','menu item'],
  prep:['الكميه المحضره','المحضر','محضره','المحضره','الكميه المجهزه','المجهزه','مجهزه','تحضير','prepared','produced','cooked'],
  sold:['الكميه المباعه','المباع','مبيعات','المبيعات','الكميه','عدد','sold','sales','qty','quantity'],
  price:['السعر','سعر','price'],
  weather:['الطقس','طقس','الجو','weather'],
  weekend:['ويك اند','ويكند','weekend','عطله','نهايه الاسبوع'],

const DERIVED=['اليوم','الفصل','الموسم','السنه','الشهر','اليوم في الشهر','الايراد','الفاضل','revenue','month','year','season','weekday','day name','total','الاجمالي'];
function parseDateCell(v){
  if(v==null||v==='') return null;
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
  if(typeof v==='number'){ if(v>20000&&v<80000){const p=XLSX.SSF.parse_date_code(v);return `${p.y}-${pad(p.m)}-${pad(p.d)}`} return null }
  const s=westDigits(v).trim();let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return valid(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;if(b>12&&a<=12)[a,b]=[b,a];return valid(y,b,a)}
  return null;
  function valid(y,mo,d){if(mo<1||mo>12||d<1||d>31||y<1990||y>2100)return null;const iso=`${y}-${pad(mo)}-${pad(d)}`;return numIso(isoNum(iso))===iso?iso:null}
}
function parseNumCell(v){if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;if(typeof v==='boolean')return v?1:0;const s=westDigits(v).replace(/,/g,'').trim();if(!/^-?\d+(\.\d+)?$/.test(s))return null;return +s}

function profile(rows,ci){
  let nn=0,dates=0,nums=0,bins=0,strs=0;const distinct=new Set();
  for(let i=0;i<rows.length&&nn<600;i++){const v=rows[i][ci];if(v==null||v==='')continue;nn++;
    if(parseDateCell(v)&&!(typeof v==='number'&&v<20000))dates++;
    if(parseNumCell(v)!=null)nums++; if(isBinaryCell(v))bins++;
    if(typeof v==='string'&&parseNumCell(v)==null)strs++; if(distinct.size<200)distinct.add(String(v));}
  const r=x=>nn?x/nn:0;
  return {nn,date:r(dates),num:r(nums),bin:r(bins),str:r(strs),distinct:distinct.size};
}
function readSheet(wb,name){
  const ws=wb.Sheets[name];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
  let h=0;for(let i=0;i<Math.min(10,aoa.length);i++){if((aoa[i]||[]).filter(v=>typeof v==='string'&&v.trim()).length>=2){h=i;break}}
  const header=(aoa[h]||[]).map((v,i)=>v==null||String(v).trim()===''?`عمود ${i+1}`:String(v).trim());
  const rows=aoa.slice(h+1).filter(r=>r&&r.some(v=>v!=null&&v!==''));
  return {header,rows};
}
function scoreName(col,list){const n=norm(col);let best=0;for(const w of list){const k=norm(w);if(n===k)best=Math.max(best,3);else if(n.startsWith(k)||n.endsWith(k))best=Math.max(best,2);else if(n.includes(k))best=Math.max(best,1)}return best}
function guessMapping(sheet){
  const {header,rows}=sheet;const profs=header.map((_,i)=>profile(rows,i));
  const used=new Set();const map={date:-1,dish:-1,sold:-1,prep:-1,price:-1,weather:-1,weekend:-1};
  const ok={date:p=>p.date>.8,dish:p=>p.str>.6,sold:p=>p.num>.9&&p.bin<.98,prep:p=>p.num>.9&&p.bin<.98,price:p=>p.num>.9,weather:p=>p.str>.6&&p.distinct<40,weekend:p=>p.bin>.95};
  for(const role of ['date','dish','prep','sold','price','weather','weekend']){
    let bi=-1,bs=0;header.forEach((c,i)=>{if(used.has(i)||!ok[role](profs[i]))return;if(role!=='weekend'&&scoreName(c,DERIVED)>=2&&scoreName(c,SYN[role])<3)return;const s=scoreName(c,SYN[role]);if(s>bs){bs=s;bi=i}});
    if(bi<0&&role==='date'){bi=profs.findIndex((p,i)=>!used.has(i)&&p.date>.9)}
    if(bi>=0){map[role]=bi;used.add(bi)}
  }
  const derived=i=>scoreName(header[i],DERIVED)>=2;
  const format=map.dish>=0?'long':'wide';
  const events=[];const wideDishes=[];
  header.forEach((c,i)=>{if(used.has(i)||!profs[i].nn)return;if(profs[i].bin<=.98&&derived(i))return;
    if(profs[i].bin>.98){ if(calMatchFor(header[i])||!derived(i)) events.push(i); }
    else if(profs[i].num>.9&&format==='wide') wideDishes.push(i);});

}
function buildRestaurant(sheet,g,name){
  const {header,rows}=sheet;const m=g.map;const rep={rows:rows.length,skipped:0,dupes:0,neg:0};
  const evNames=g.events.map(i=>header[i]);const events=buildEvents(evNames);
  const dishes=[];const dIdx=new Map();const dishOf=n=>{if(!dIdx.has(n)){dIdx.set(n,dishes.length);dishes.push({name:n,price:null,est:null,active:true})}return dIdx.get(n)};
  const weatherCats=[];const wIdx=new Map();

  const prices={};
  if(g.format==='wide') g.wideDishes.forEach(i=>dishOf(String(header[i])));
  for(const r of rows){
    const iso=parseDateCell(r[m.date]); if(!iso){rep.skipped++;continue}
    const day=days[iso]||(days[iso]={s:[],p:[],w:null,e:[]});
    if(m.weather>=0&&r[m.weather]!=null&&String(r[m.weather]).trim()){const w=String(r[m.weather]).trim();if(!wIdx.has(w)){wIdx.set(w,weatherCats.length);weatherCats.push(w)}day.w=wIdx.get(w)}
    g.events.forEach((ci,j)=>{if(parseNumCell(r[ci])===1&&!day.e.includes('f'+j))day.e.push('f'+j)});
    if(m.weekend>=0){const v=parseNumCell(r[m.weekend]);if(v===0||v===1)wkCount[dowOf(iso)][v]++}
    if(g.format==='long'){
      const dn=r[m.dish]==null?'':String(r[m.dish]).trim(); if(!dn){rep.skipped++;continue}
      const s=parseNumCell(r[m.sold]); if(s==null){rep.skipped++;continue} if(s<0){rep.neg++;continue}
      const di=dishOf(dn); if(day.s[di]!=null)rep.dupes++; day.s[di]=(day.s[di]||0)+s;
      if(m.prep>=0){const p=parseNumCell(r[m.prep]);if(p!=null&&p>=0)day.p[di]=(day.p[di]||0)+p}
      if(m.price>=0){const p=parseNumCell(r[m.price]);if(p!=null&&p>0)prices[di]=p}
    }else{
      g.wideDishes.forEach((ci,j)=>{const s=parseNumCell(r[ci]);if(s==null)return;if(s<0){rep.neg++;return}const di=j;if(day.s[di]!=null)rep.dupes++;day.s[di]=(day.s[di]||0)+s});
    }
  }
  for(const iso in days){const d=days[iso];if(!d.s.some(v=>v!=null))delete days[iso]}
  Object.entries(prices).forEach(([di,p])=>dishes[di].price=p);
  let weekend=[5,6];
  if(m.weekend>=0){const w=[];wkCount.forEach((c,d)=>{if(c[1]>c[0])w.push(d)});if(w.length&&w.length<7)weekend=w}
  const hasPrep=g.format==='long'&&m.prep>=0;
  const R={id:uid(),name:name||'مطعمي',dishes,weekend,school:{start:'09-21',bStart:'01-24',bEnd:'02-07',end:'06-10'},events,weatherCats,hasPrep,safety:'balanced',days,created:Date.now()};
  const isos=Object.keys(days).sort();rep.days=isos.length;rep.first=isos[0];rep.last=isos[isos.length-1];rep.dishes=dishes.length;
  if(isos.length){let gaps=0;for(let i=1;i<isos.length;i++)if(isoNum(isos[i])-isoNum(isos[i-1])>1)gaps+=isoNum(isos[i])-isoNum(isos[i-1])-1;rep.gaps=gaps}
  return {R,rep};
}
function mergeInto(A,B){ // B's data into A (by dish name, event name)
  const dmap=B.dishes.map(d=>{let i=A.dishes.findIndex(x=>x.name===d.name);if(i<0){A.dishes.push({...d});i=A.dishes.length-1}else if(d.price)A.dishes[i].price=d.price;return i});
  const emap={};B.events.forEach(e=>{let x=A.events.find(a=>a.name===e.name);if(!x&&e.file){x={...e,key:'f'+uid()};A.events.push(x)}if(x)emap[e.key]=x.key});
  const wmap=B.weatherCats.map(w=>{let i=A.weatherCats.indexOf(w);if(i<0){A.weatherCats.push(w);i=A.weatherCats.length-1}return i});
  for(const iso in B.days){const b=B.days[iso];const a={s:[],p:[],w:b.w==null?null:wmap[b.w],e:(b.e||[]).map(k=>emap[k]).filter(Boolean)};
    b.s.forEach((v,i)=>{if(v!=null)a.s[dmap[i]]=v});(b.p||[]).forEach((v,i)=>{if(v!=null)a.p[dmap[i]]=v});A.days[iso]=a}

/* ============ model: per-dish ridge regression on log(sales) ============ */
function layout(R){const E=R.events.length,W=R.weatherCats.length;return {E,W,ev:21,w:21+E,t:21+E+W,k:22+E+W}}
function featurize(R,L,iso,evSet,w,t){
  const x=new Float64Array(L.k);x[0]=1;const dw=dowOf(iso);x[1+dw]=1;x[8]=R.weekend.includes(dw)?1:0;x[9+(+iso.slice(5,7))-1]=1;
  R.events.forEach((e,i)=>{if(evSet.has(e.key))x[L.ev+i]=1});
  if(w!=null&&w<L.W)x[L.w+w]=1; x[L.t]=t; return x;
}
function solve(A,b){const n=b.length;const M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];const d=M[c][c]||1e-12;
    for(let r=c+1;r<n;r++){const f=M[r][c]/d;if(!f)continue;for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k]}}
  const x=new Array(n).fill(0);for(let r=n-1;r>=0;r--){let s=M[r][n];for(let k=r+1;k<n;k++)s-=M[r][k]*x[k];x[r]=s/(M[r][r]||1e-12)}return x}
function fitRidge(Xs,ys,lambda=1){
  const k=Xs[0].length;const A=Array.from({length:k},()=>new Array(k).fill(0));const b=new Array(k).fill(0);
  for(let r=0;r<Xs.length;r++){const x=Xs[r],y=ys[r];for(let i=0;i<k;i++){if(!x[i])continue;b[i]+=x[i]*y;for(let j=i;j<k;j++)A[i][j]+=x[i]*x[j]}}
  for(let i=0;i<k;i++){for(let j=0;j<i;j++)A[i][j]=A[j][i];if(i>0)A[i][i]+=lambda}
  return solve(A,b);
}
const dot=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s};
function trainOn(R,isos,L,feats){
  const t0=isoNum(isos[0]);const out=[];
  R.dishes.forEach((d,di)=>{
    const Xs=[],ys=[];const recent=[];
    isos.forEach(iso=>{const v=R.days[iso].s[di];if(v==null)return;Xs.push(feats.get(iso));ys.push(Math.log1p(v));recent.push(v)});
    if(Xs.length<21){out[di]=Xs.length?{type:'avg',mean:recent.reduce((a,b)=>a+b,0)/recent.length,n:Xs.length}:null;return}
    const beta=fitRidge(Xs,ys,1);let ss=0;Xs.forEach((x,i)=>{const r=ys[i]-dot(beta,x);ss+=r*r});
    const sigma=Math.max(.05,Math.sqrt(ss/Math.max(1,Xs.length-L.k*.5))*1.1);
    const last=recent.slice(-90);out[di]={type:'ridge',beta,sigma,n:Xs.length,mean:last.reduce((a,b)=>a+b,0)/last.length};
  });
  return {dish:out,t0,tMax:(isoNum(isos[isos.length-1])-t0)/365};
}
const SAFETY={low:{z:0,label:'أقل هدر',hint:'حضّر على قد المتوقع بالظبط — يكفي في نص الأيام تقريباً'},balanced:{z:.5,label:'متوازن',hint:'زيادة صغيرة فوق المتوقع — يكفي في حوالي ٧ أيام من ١٠'},safe:{z:1,label:'ما ينقصش',hint:'هامش أكبر — يكفي في حوالي ٨ أيام من ١٠، والهدر أعلى'}};
function predictDish(R,M,L,di,x,z){
  const m=M.dish[di];const d=R.dishes[di];
  if(!m) return null;
  if(m.type==='avg') return {mid:m.mean,lo:m.mean*.75,hi:m.mean*1.25,rec:m.mean*(1+.15*z),basic:true};
  const mu=dot(m.beta,x);return {mid:Math.expm1(mu),lo:Math.max(0,Math.expm1(mu-1.28*m.sigma)),hi:Math.expm1(mu+1.28*m.sigma),rec:Math.expm1(mu+z*m.sigma)};

function buildFeats(R,isos,L,t0){const f=new Map();isos.forEach(iso=>{const d=R.days[iso];f.set(iso,featurize(R,L,iso,activeEvents(R,iso,d),d.w,(isoNum(iso)-t0)/365))});return f}

  const isos=Object.keys(R.days).sort();if(!isos.length)return null;
  const L=layout(R);const t0=isoNum(isos[0]);const feats=buildFeats(R,isos,L,t0);
  const model=trainOn(R,isos,L,feats);model.L=L;model.first=isos[0];model.last=isos[isos.length-1];model.days=isos.length;
  // backtest: hide the last 60 days, train on the rest, compare
  if(isos.length>=150){
    const tr=isos.slice(0,-60),te=isos.slice(-60);
    const bm=trainOn(R,tr,L,feats);const z=SAFETY[R.safety||'balanced'].z;
    const per=R.dishes.map(()=>({ae:0,sum:0,n:0}));let hw=0,mw=0,ms=0,sold=0,hwM=0,mwM=0,hasP=false;
    te.forEach(iso=>{const day=R.days[iso];const x=feats.get(iso);
      R.dishes.forEach((d,di)=>{const v=day.s[di];if(v==null)return;const p=predictDish(R,bm,L,di,x,z);if(!p)return;
        per[di].ae+=Math.abs(p.mid-v);per[di].sum+=v;per[di].n++;const rec=Math.ceil(p.rec);
        mw+=Math.max(0,rec-v);ms+=Math.max(0,v-rec);sold+=v;mwM+=Math.max(0,rec-v)*(d.price||0);
        const pv=day.p&&day.p[di];if(pv!=null){hasP=true;hw+=Math.max(0,pv-v);hwM+=Math.max(0,pv-v)*(d.price||0)}});});
    model.bt={days:te.length,per:per.map(p=>p.n?{mae:p.ae/p.n,acc:Math.max(0,1-p.ae/p.sum)}:null),mw,ms,sold,hw:hasP?hw:null,mwM,hwM:hasP?hwM:null,z};
    const tot=per.reduce((a,p)=>({ae:a.ae+p.ae,sum:a.sum+p.sum}),{ae:0,sum:0});model.bt.acc=tot.sum?Math.max(0,1-tot.ae/tot.sum):null;

function forecast(R,M,iso,evSet,w,leftovers){
  const L=M.L;const t=Math.min((isoNum(iso)-M.t0)/365,M.tMax+.25);const x=featurize(R,L,iso,evSet,w,t);const z=SAFETY[R.safety||'balanced'].z;
  const rows=[];let sumPred=0,sumMean=0;
  R.dishes.forEach((d,di)=>{if(d.active===false)return;const p=predictDish(R,M,L,di,x,z);
    if(p&&!p.basic){sumPred+=p.mid;sumMean+=M.dish[di].mean}
    rows.push({di,d,p});});
  const factor=sumMean?sumPred/sumMean:1;
  rows.forEach(r=>{if(!r.p&&r.d.est){const m=r.d.est*factor;r.p={mid:m,lo:m*.7,hi:m*1.3,rec:m*(1+.2*z),isNew:true}}
    if(r.p){const lo=Math.max(0,+(leftovers[r.di]||0));r.left=lo;r.recRaw=Math.ceil(r.p.rec);r.prep=Math.max(0,r.recRaw-lo)}});
  return {rows,factor};
}

function renderWeek(sel){

}

  const rows=R.dishes.map((d,di)=>d.active===false?'':`<tr><td>${esc(d.name)}</td><td><input type="number" min="0" id="ls-${di}" data-ls="${di}" value="${day&&day.s[di]!=null?day.s[di]:''}" placeholder="—"></td><td><input type="number" min="0" id="lp-${di}" data-lp="${di}" value="${day&&day.p&&day.p[di]!=null?day.p[di]:(rec[di]??'')}"></td></tr>`).join('');
  return `<div class="grid2"><div class="card"><h3>سجّل مبيعات يوم</h3>
   <p class="small muted" style="margin-top:0">آخر اليوم اكتب اللي اتباع فعلاً. كل يوم بتسجّله التوقع بيتعلّم منه ويبقى أدق.</p>
   <div class="map"><div class="field"><label for="logDate">التاريخ</label><input type="date" id="logDate" value="${iso}"></div>
   ${R.weatherCats.length?`<div class="field"><label for="logW">الطقس</label><select id="logW">${R.weatherCats.map((c,i)=>`<option value="${i}" ${i===(day&&day.w!=null?day.w:w)?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`:''}</div>
   <div class="field"><span class="lbl">مناسبات اليوم ده</span><div class="chips">${eventToggles(R,evSet,'log')}</div></div>
   <div class="tbl-wrap" style="margin-top:12px"><table class="tbl log-table"><thead><tr><th>الأكلة</th><th>اتباع</th><th>اتحضّر</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="actions" style="margin-top:12px"><button class="btn primary" id="logSave">${day?'تحديث اليوم':'حفظ اليوم'}</button></div></div>
   <div class="card"><h3>أكلة جديدة في المنيو</h3><p class="small muted" style="margin-top:0">لو لسه مضافة ومالهاش تاريخ، اكتب متوسط تقريبي — التطبيق هيظبطه حسب اليوم (ويك إند، رمضان…) لحد ما يتجمّع لها بيانات.</p>
   <div class="map"><div class="field"><label for="nd-name">اسم الأكلة</label><input type="text" id="nd-name"></div><div class="field"><label for="nd-est">بيتباع منها في اليوم تقريباً</label><input type="number" id="nd-est" min="0"></div><div class="field"><label for="nd-price">السعر (اختياري)</label><input type="number" id="nd-price" min="0"></div></div>
   <button class="btn" id="ndAdd">إضافة</button>
   <p class="lbl" style="margin:16px 0 6px">أكلات المنيو</p><div class="checks">${R.dishes.map((d,i)=>`<label class="chip ${d.active!==false?'on':''}"><input type="checkbox" data-act="${i}" ${d.active!==false?'checked':''}>${esc(d.name)}</label>`).join('')}</div>
   <p class="small muted">شيل العلامة من أكلة اتشالت من المنيو عشان ماتظهرش في ورقة التحضير.</p></div></div>`;
}
function renderSettings(){
  const R=S.R;const y=+todayIso().slice(0,4);
  const calRows=[];for(const yy of [y,y+1]){const r=ISL[yy];if(r){calRows.push([`رمضان ${yy}`,`${yy}-${r[0]}`],[`عيد الفطر ${yy}`,`${yy}-${r[1]}`],[`عيد الأضحى ${yy}`,`${yy}-${r[2]}`])}calRows.push([`شم النسيم ${yy}`,addDays(orthodoxEaster(yy),1)])}
  calRows.sort((a,b)=>a[1]<b[1]?-1:1);
  const src=e=>e.file?(e.match?'من ملفك، والأيام الجاية من التقويم':'من ملفك — بتعلّمه بإيدك في اليوم بتاعه'):'من التقويم المدمج';
  return `<div class="grid2"><div class="card"><h3>المطعم</h3>
   <div class="field"><label for="setName">الاسم</label><input type="text" id="setName" value="${esc(R.name)}"></div>
   <p class="lbl" style="margin:14px 0 6px">أيام الويك إند عندك</p><div class="checks">${DAYS.map((d,i)=>`<label class="chip ${R.weekend.includes(i)?'hot':''}"><input type="checkbox" data-wk="${i}" ${R.weekend.includes(i)?'checked':''}>${d}</label>`).join('')}</div>
   <p class="lbl" style="margin:14px 0 6px">مواعيد الدراسة (شهر-يوم)</p>
   <div class="map"><div class="field"><label for="sc-start">بداية السنة</label><input type="text" id="sc-start" value="${R.school.start}" inputmode="numeric"></div><div class="field"><label for="sc-end">نهاية السنة</label><input type="text" id="sc-end" value="${R.school.end}" inputmode="numeric"></div><div class="field"><label for="sc-bs">بداية نص السنة</label><input type="text" id="sc-bs" value="${R.school.bStart}" inputmode="numeric"></div><div class="field"><label for="sc-be">نهاية نص السنة</label><input type="text" id="sc-be" value="${R.school.bEnd}" inputmode="numeric"></div></div>
   <button class="btn primary" id="setSave">حفظ وإعادة التدريب</button></div>
   <div class="card"><h3>المناسبات اللي التطبيق بيراعيها</h3><div class="tbl-wrap"><table class="tbl"><tbody>${R.events.map(e=>`<tr><td>${esc(e.name)}</td><td class="small muted">${src(e)}</td></tr>`).join('')}</tbody></table></div>
   <p class="lbl" style="margin:14px 0 6px">التقويم المدمج (مصر)</p><div class="tbl-wrap"><table class="tbl"><tbody>${calRows.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td></tr>`).join('')}</tbody></table></div>
   <p class="small muted">مواعيد رمضان والأعياد تقريبية (±يوم حسب الرؤية). لو اختلفت، علّم المناسبة بإيدك من صفحة التحضير.</p></div></div>`;
}

/* ============ export / template ============ */
function xlsxBuf(sheets){const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};sheets.forEach(([name,aoa])=>{const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=aoa[0].map(()=>({wch:16}));XLSX.utils.book_append_sheet(wb,ws,name)});return new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
function exportData(){
  const R=S.R;const evs=R.events;const head=['التاريخ','اليوم','ويك اند','الفصل',...(R.weatherCats.length?['الطقس']:[]),'الأكلة','السعر (جنيه)','الكمية المباعة','الكمية المحضرة',...evs.map(e=>e.name)];
  const aoa=[head];Object.keys(R.days).sort().forEach(iso=>{const d=R.days[iso];const ev=activeEvents(R,iso,d);const dw=dowOf(iso);
    R.dishes.forEach((dish,di)=>{if(d.s[di]==null)return;aoa.push([iso,DAYS[dw],R.weekend.includes(dw)?1:0,seasonOf(iso),...(R.weatherCats.length?[d.w!=null?R.weatherCats[d.w]:'']:[]),dish.name,dish.price??'',d.s[di],d.p&&d.p[di]!=null?d.p[di]:'',...evs.map(e=>ev.has(e.key)?1:0)])})});
  saveFile(`${R.name} - بيانات.xlsx`,xlsxBuf([['البيانات',aoa]]));
}
function downloadTemplate(){
  const t=todayIso();const d1=addDays(t,-2),d2=addDays(t,-1);
  const sales=[['التاريخ','الأكلة','الكمية المباعة','الكمية المحضرة','السعر','الطقس'],[d1,'كشري',63,70,25,'معتدل'],[d1,'طعمية',58,60,10,'معتدل'],[d2,'كشري',55,60,25,'حار'],[d2,'طعمية',49,55,10,'حار']];
  const how=[['إزاي تملا الملف'],['كل صف = أكلة واحدة في يوم واحد.'],['الأعمدة المطلوبة: التاريخ + الأكلة + الكمية المباعة.'],['الكمية المحضرة والسعر والطقس اختياريين — امسح العمود لو مش عندك.'],['اكتب التاريخ بالشكل 2025-03-01 أو 01/03/2025.'],['مش محتاج تكتب اليوم أو الويك إند أو الفصل أو رمضان والأعياد — التطبيق بيحسبهم من التاريخ.'],['لو عندك مناسبة خاصة بيك (ماتش، مولد في المنطقة…) زوّد عمود باسمها واكتب 1 في أيامها و0 في الباقي.'],['كل ما البيانات أطول (سنة أو سنتين) التوقع يبقى أدق.']];
  saveFile('نموذج بيانات المطعم.xlsx',xlsxBuf([['المبيعات',sales],['التعليمات',how]]));
}

/* ============ events ============ */
async function openFile(file){
  try{let wb;if(/\.(csv|txt|tsv)$/i.test(file.name)){const txt=(await file.text()).replace(/^\uFEFF/,'');wb=XLSX.read(txt,{type:'string',raw:true})}else{const buf=await file.arrayBuffer();wb=XLSX.read(buf,{type:'array',cellDates:true})}const sheetName=wb.SheetNames[0];const sheet=readSheet(wb,sheetName);
    S.draft={file:file.name,wb,sheetName,sheet,g:guessMapping(sheet),name:file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),into:'new'};render();window.scrollTo({top:0})}
  catch(e){toast('مش قادر أقرا الملف ده — جرّب Excel أو CSV')}
}
function readMappingFromDom(){
  const D=S.draft;const g=D.g;const v=id=>{const el=$('#'+id);return el?+el.value:-1};
  g.map.date=v('m-date');if(g.format==='long'){g.map.dish=v('m-dish');g.map.sold=v('m-sold');g.map.prep=v('m-prep');g.map.price=v('m-price')}
  g.map.weather=v('m-weather');g.map.weekend=v('m-weekend');
  const nm=$('#impName');if(nm)D.name=nm.value;
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-go]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.draft=null;S.evSet=null;render();return}
  if(t.dataset.go==='upload'){S.tab='data';S.draft=null;render();$('#drop')&&$('#drop').scrollIntoView({block:'center'});return}
  if(t.dataset.safety){S.R.safety=t.dataset.safety;S.M=train(S.R);render();if(!S.R.demo)persist([]);return}
  if(t.dataset.day){S.date=t.dataset.day;render();return}
  switch(t.id){
    case 'newRest':S.tab='data';S.draft=null;render();$('#fileIn')&&$('#fileIn').click();break;
    case 'copyT':{const txt=receiptText();try{await navigator.clipboard.writeText(txt);toast('اتنسخ')}catch(err){toast('النسخ مش متاح هنا')}break}
    case 'dlT':saveFile(`food_receipt_${S.date}.txt`,receiptText());break;
    case 'tmpl':downloadTemplate();break;
    case 'exportX':exportData();break;
    case 'delR':S.confirmDel=true;render();break;
    case 'delNo':S.confirmDel=false;render();break;
    case 'delYes':{await Store.remove(S.R.id);await refreshList();toast('المطعم اتمسح');const nx=S.list[0];setRestaurant(nx?await Store.load(nx.id):loadDemo());break}
    case 'impCancel':S.draft=null;render();break;
    case 'impGo':{readMappingFromDom();const D=S.draft;const res=buildRestaurant(D.sheet,D.g,D.name);let R=res.R;
      if(D.into==='merge'&&S.R&&!S.R.demo){mergeInto(S.R,R);R=S.R}
      S.draft=null;S.tab='today';S.date=todayIso();setRestaurant(R);await persist(null);toast(`اتدرّب على ${fmt(res.rep.days)} يوم و${res.rep.dishes} أكلة`);break}
    case 'logSave':{const R=S.R;const iso=S.logDate;const day={s:[],p:[],w:null,e:[],full:true};let any=false;
      R.dishes.forEach((d,di)=>{const s=$('#ls-'+di),p=$('#lp-'+di);if(s&&s.value!==''){day.s[di]=Math.max(0,+s.value);any=true;if(p&&p.value!=='')day.p[di]=Math.max(0,+p.value)}});
      if(!any){toast('اكتب الكمية اللي اتباعت لأكلة واحدة على الأقل');break}
      const wl=$('#logW');if(wl)day.w=+wl.value;day.e=$$('input[data-ev][data-scope=log]').filter(x=>x.checked).map(x=>x.dataset.ev);
      if(day.p.some(v=>v!=null))R.hasPrep=true;R.days[iso]=day;S.M=train(R);S.evSet=null;render();await persist([iso]);toast('اتسجّل — والتوقع اتحدّث');break}
    case 'ndAdd':{const n=$('#nd-name').value.trim(),est=+$('#nd-est').value,pr=+$('#nd-price').value;if(!n||!(est>0)){toast('اكتب اسم الأكلة والمتوسط');break}
      if(S.R.dishes.some(d=>d.name===n)){toast('الأكلة دي موجودة');break}S.R.dishes.push({name:n,est,price:pr>0?pr:null,active:true});S.M=train(S.R);render();await persist([]);toast('اتضافت');break}
    case 'setSave':{const R=S.R;const ok=x=>/^\d{2}-\d{2}$/.test(x);const sc={start:$('#sc-start').value.trim(),end:$('#sc-end').value.trim(),bStart:$('#sc-bs').value.trim(),bEnd:$('#sc-be').value.trim()};
      if(!Object.values(sc).every(ok)){toast('اكتب المواعيد بالشكل 09-21');break}
      const wk=$$('input[data-wk]').filter(x=>x.checked).map(x=>+x.dataset.wk);if(!wk.length||wk.length===7){toast('اختار يوم ويك إند واحد على الأقل');break}
      R.name=$('#setName').value.trim()||R.name;R.school=sc;R.weekend=wk;S.M=train(R);render();await persist([]);toast('اتحفظ');break}
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='restSel'){const id=t.value;if(id==='demo')setRestaurant(loadDemo());else{const R=await Store.load(id);if(R)setRestaurant(R);else toast('مش لاقي المطعم ده')}return}
  if(t.id==='dateIn'){if(t.value){S.date=t.value;render()}return}
  if(t.id==='logDate'){if(t.value){S.logDate=t.value;S.evSet=null;render()}return}
  if(t.id==='wIn'){S.weather={iso:S.date,w:+t.value};render();return}
  if(t.id==='fileIn'&&t.files[0]){openFile(t.files[0]);return}
  if(t.dataset.ev){const iso=t.dataset.scope==='log'?S.logDate:S.date;const cur=S.evSet&&S.evSet.iso===iso?S.evSet.set:(t.dataset.scope==='log'&&S.R.days[iso]?activeEvents(S.R,iso,S.R.days[iso]):activeEvents(S.R,iso,null));const set=new Set(cur);t.checked?set.add(t.dataset.ev):set.delete(t.dataset.ev);S.evSet={iso,set};render();return}
  if(t.dataset.act!=null){S.R.dishes[+t.dataset.act].active=t.checked;render();persist([]);return}
  if(S.draft){const D=S.draft;
    if(t.id==='shSel'){D.sheetName=t.value;D.sheet=readSheet(D.wb,t.value);D.g=guessMapping(D.sheet);render();return}
    if(t.name==='into'){D.into=t.value;return}
    readMappingFromDom();
    if(t.name==='fmt'){D.g.format=t.value;if(t.value==='wide'&&!D.g.wideDishes.length){D.g.wideDishes=D.sheet.header.map((_,i)=>i).filter(i=>i!==D.g.map.date&&D.g.profs[i].num>.9&&D.g.profs[i].bin<.98&&!Object.values(D.g.map).includes(i))}}
    if(t.dataset.wd!=null){const i=+t.dataset.wd;D.g.wideDishes=t.checked?[...D.g.wideDishes,i].sort((a,b)=>a-b):D.g.wideDishes.filter(x=>x!==i)}
    if(t.dataset.evc!=null){const i=+t.dataset.evc;D.g.events=t.checked?[...D.g.events,i].sort((a,b)=>a-b):D.g.events.filter(x=>x!==i)}
    // a column can only have one role
    const roles=Object.values(D.g.map).filter(x=>x>=0);D.g.events=D.g.events.filter(i=>!roles.includes(i));D.g.wideDishes=D.g.wideDishes.filter(i=>!roles.includes(i));
    render();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;if(t.dataset.lo==null)return;const di=+t.dataset.lo;S.left[di]=Math.max(0,+t.value||0);
  const cell=$('#prep-'+di);if(cell){cell.textContent=Math.max(0,+cell.dataset.rec-S.left[di])}
  $('#totPrep').textContent=fmt($$('.prep').reduce((a,c)=>a+(+c.textContent||0),0));
});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)openFile(f)}});

/* ============ boot ============ */
(async function boot(){
  if(typeof XLSX==='undefined'){$('#main').innerHTML='<div class="empty">مكتبة Excel ما اتحمّلتش — اعمل refresh للصفحة.</div>';return}
  setRestaurant(loadDemo());
  await Store.init();S.storeReady=true;await refreshList();
  const last=Pref.get('last');const pick=S.list.find(x=>x.id===last)||S.list.slice().sort((a,b)=>b.updated-a.updated)[0];
  if(pick){const R=await Store.load(pick.id);if(R&&S.R.demo&&!S.draft)setRestaurant(R)}
  renderFoot();
})();
</script>
